spring:
  application:
    name: utsav-crackers-api
  datasource:
    url: jdbc:mysql://localhost:3306/utsav_crackers?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: utsav_app
    password: local_dev_password_change_me
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: 8080
  shutdown: graceful
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
logging:
  level:
    in.utsavcrackers: INFO
